<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ready: emergency kit planner</title>
  <meta name="description" content="Build the right emergency kit for your household, adjusted for live weather alerts where you live.">

  <!-- PWA: lets phones install Ready like an app -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#10263b">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Ready">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/home" aria-label="Ready, home">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">Ready</span>
    </a>
  </header>

  <!-- Every screen is drawn into this one element by app.js -->
  <main id="app" class="app">
    <noscript><p class="lede">Ready needs JavaScript to build your kit.</p></noscript>
  </main>

  <script src="./app.js"></script>
  <script>
    // PWA: start the service worker so Ready can open offline
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
